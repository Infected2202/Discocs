[project]
name = "discocs-bot"
version = "0.1.0"
description = "Telegram bot for Navidrome library access via Discocs recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    # Скачивание аудио по ссылке. Экстракторы ломаются вслед за сайтами —
    # версия обновляется пересборкой образа, а не автообновлением в рантайме.
    "yt-dlp>=2024.12.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
discocs-bot = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# relative_files — те же причины, что в корневом pyproject.toml: пути в
# coverage.xml должны быть относительными, иначе Sonar-scanner на хосте
# Jenkins-агента не сможет их сопоставить.
relative_files = true
source = ["bot"]
