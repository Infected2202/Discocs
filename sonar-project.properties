sonar.projectKey=discocs
# deploy — Dockerfile'ы и compose CI/CD; встроенные в Community Build
# анализаторы Secrets и Docker/IaC разбирают их без отдельного софта
# (gitleaks/hadolint не нужны).
sonar.sources=app,discocs_bot/bot,ui/src,deploy
sonar.tests=tests,discocs_bot/tests,ui/tests
sonar.test.inclusions=ui/src/**/*.test.ts,ui/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml,bot-coverage.xml
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info
