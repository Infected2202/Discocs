# Convenience wrapper — поднимает backend + nginx вместе.
# Для раздельного деплоя используй docker-compose.yml в deploy/<service>/

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "7752"
    volumes:
      - discocs-data:/app/data
      - discocs-models:/app/models
      - type: bind
        source: ${DISCOCS_MUSIC_DIR:-/path/to/music}
        target: /music
        read_only: true
    environment:
      DISCOCS_DB_PATH: /app/data/app.db
      DISCOCS_DATA_DIR: /app/data
      DISCOCS_MODEL_DIR: /app/models
      DISCOCS_INDEX_DIR: /app/data
      DISCOCS_OWNER_USER: ${DISCOCS_OWNER_USER:-owner}

  discocs-frontend:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${DISCOCS_HTTP_PORT:-80}:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "7752"
    depends_on:
      - backend

volumes:
  discocs-data:
  discocs-models:
