services:
  worker:
    image: ${DISCOCS_WORKER_IMAGE:-discocs-worker:dev}
    restart: unless-stopped
    environment:
      DISCOCS_WORKER_SERVER: ${DISCOCS_WORKER_SERVER:-http://192.168.1.41:8711}
      DISCOCS_WORKER_ID: ${DISCOCS_WORKER_ID:-auto}
      DISCOCS_WORKER_EMBEDDING_MODEL: ${DISCOCS_WORKER_EMBEDDING_MODEL:-discogs_multi}
      DISCOCS_WORKER_AUDIO_FEATURE_MODEL: ${DISCOCS_WORKER_AUDIO_FEATURE_MODEL:-audio_features_v1}
      DISCOCS_WORKER_HEAD_MODEL: ${DISCOCS_WORKER_HEAD_MODEL:-discogs-effnet-heads}
      DISCOCS_WORKER_CLAIM_BATCH_SIZE: ${DISCOCS_WORKER_CLAIM_BATCH_SIZE:-32}
      DISCOCS_WORKER_MAX_INFLIGHT_TASKS: ${DISCOCS_WORKER_MAX_INFLIGHT_TASKS:-128}
      DISCOCS_WORKER_DOWNLOAD_CONCURRENCY: ${DISCOCS_WORKER_DOWNLOAD_CONCURRENCY:-8}
      DISCOCS_WORKER_SUBMIT_BATCH_SIZE: ${DISCOCS_WORKER_SUBMIT_BATCH_SIZE:-1}
      DISCOCS_WORKER_LEASE_SECONDS: ${DISCOCS_WORKER_LEASE_SECONDS:-900}
      DISCOCS_WORKER_POLL_SECONDS: ${DISCOCS_WORKER_POLL_SECONDS:-5}
      DISCOCS_WORKER_CPU_WORKERS: ${DISCOCS_WORKER_CPU_WORKERS:-0}
      DISCOCS_WORKER_GPU_BATCH_SIZE: ${DISCOCS_WORKER_GPU_BATCH_SIZE:-64}
      DISCOCS_WORKER_READY_BATCHES: ${DISCOCS_WORKER_READY_BATCHES:-1}
      DISCOCS_WORKER_MAX_TASKS_BEFORE_EXIT: ${DISCOCS_WORKER_MAX_TASKS_BEFORE_EXIT:-0}
      DISCOCS_WORKER_EMBEDDING_BACKEND: ${DISCOCS_WORKER_EMBEDDING_BACKEND:-auto}
      DISCOCS_EFFNET_BACKEND: ${DISCOCS_EFFNET_BACKEND:-auto}
      DISCOCS_MODEL_DIR: /app/models
      DISCOCS_DATA_DIR: /worker-data
      DISCOCS_DB_PATH: /worker-data/worker-local.db
      DISCOCS_INDEX_DIR: /worker-data
      DISCOCS_AUDIO_LOADER: ffmpeg
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - type: bind
        source: "${DISCOCS_WORKER_MODEL_DIR:-C:\\Dockers\\discocs\\models}"
        target: /app/models
        bind:
          create_host_path: false
      - discocs-worker-data:/worker-data
    entrypoint: ["python", "-m", "app.cli"]
    command:
      - worker
      - --server
      - ${DISCOCS_WORKER_SERVER:-http://192.168.1.41:8711}
      - --worker-id
      - ${DISCOCS_WORKER_ID:-auto}
      - --models
      - ${DISCOCS_WORKER_EMBEDDING_MODEL:-discogs_multi}
      - --models
      - ${DISCOCS_WORKER_AUDIO_FEATURE_MODEL:-audio_features_v1}
      - --models
      - ${DISCOCS_WORKER_HEAD_MODEL:-discogs-effnet-heads}
      - --claim-batch-size
      - ${DISCOCS_WORKER_CLAIM_BATCH_SIZE:-32}
      - --max-inflight-tasks
      - ${DISCOCS_WORKER_MAX_INFLIGHT_TASKS:-128}
      - --download-concurrency
      - ${DISCOCS_WORKER_DOWNLOAD_CONCURRENCY:-8}
      - --submit-batch-size
      - ${DISCOCS_WORKER_SUBMIT_BATCH_SIZE:-1}
      - --lease-seconds
      - ${DISCOCS_WORKER_LEASE_SECONDS:-900}
      - --poll-seconds
      - ${DISCOCS_WORKER_POLL_SECONDS:-5}
      - --cpu-workers
      - ${DISCOCS_WORKER_CPU_WORKERS:-0}
      - --gpu-batch-size
      - ${DISCOCS_WORKER_GPU_BATCH_SIZE:-64}
      - --ready-batches
      - ${DISCOCS_WORKER_READY_BATCHES:-1}
      - --max-tasks-before-exit
      - ${DISCOCS_WORKER_MAX_TASKS_BEFORE_EXIT:-0}
      - --embedding-backend
      - ${DISCOCS_WORKER_EMBEDDING_BACKEND:-auto}
    gpus: all

volumes:
  discocs-worker-data:
