[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discocs"
version = "0.1.0"
description = "Local Discogs-EffNet music recommendations over a personal audio library."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "cryptography>=43",
  "fastapi>=0.111",
  "hnswlib>=0.8",
  "mutagen>=1.47",
  "numpy>=1.26,<2",
  "Pillow>=10",
  "pydantic>=2.7",
  "typer>=0.12",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
essentia = [
  "essentia-tensorflow>=2.1b6.dev1110; platform_system == 'Linux'",
]
muq = [
  "muq",
  "torch>=2.1",
  "torchaudio>=2.1",
]
map = [
  # Collection-map / embedding-atlas 2D projections. Imported lazily; unit
  # tests use an injected fake projector and do not require these.
  "umap-learn>=0.5",
  "scikit-learn>=1.3",
]
dev = [
  "httpx2>=2.4",
  "pytest>=8.2",
  "pytest-xdist>=3.6",
  "pytest-cov>=5.0",
]

[project.scripts]
recs = "app.cli:main"

[tool.uv]
# requires-python (3.11-3.15) — широкий диапазон для совместимости, но
# реально код гоняется только на 3.11 (Dockerfile.test) и 3.12 (прод-образы).
# Без этого uv lock резолвит "универсально" по всему диапазону и может
# закрепить версию essentia-tensorflow, у которой есть wheel только под
# гипотетический 3.14 — ломает `uv sync --frozen` на 3.12 (см. git history).
environments = [
  "python_version == '3.11'",
  "python_version == '3.12'",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# relative_files делает пути в coverage.xml относительными (app/foo.py, не
# /app/app/foo.py) — иначе Sonar-scanner, запущенный на хосте Jenkins-агента,
# не может сопоставить пути, записанные внутри тестового контейнера.
relative_files = true
source = ["app"]
