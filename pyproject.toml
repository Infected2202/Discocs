[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discocs"
version = "0.1.0"
description = "Local Discogs-EffNet music recommendations over a personal audio library."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.111",
  "hnswlib>=0.8",
  "mutagen>=1.47",
  "numpy>=1.26,<2",
  "pydantic>=2.7",
  "typer>=0.12",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
essentia = [
  "essentia-tensorflow>=2.1b6.dev1110; platform_system == 'Linux'",
]
muq = [
  "muq",
  "torch>=2.1",
  "torchaudio>=2.1",
]
dev = [
  "httpx2>=2.4",
  "pytest>=8.2",
]

[project.scripts]
recs = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
