# Production compose — тянет ГОТОВЫЕ образы из Nexus (docker-dev @ 192.168.1.41:5000),
# в отличие от dev-compose в корне, который собирает локально (build:).
#
# Запускается на хосте 192.168.1.41 стадией Deploy в Jenkinsfile:
#   docker compose -p discocs -f deploy/prod/docker-compose.yml --env-file <env> pull
#   docker compose -p discocs -f deploy/prod/docker-compose.yml --env-file <env> up -d --remove-orphans
#
# Откат на прошлый билд: поставь TAG=<git-sha> в .env и повтори up.
# Бот и его awg-туннель стартуют только при COMPOSE_PROFILES=bot (см. .env.example).
#
# Данные сервисов лежат на хосте под ${DISCOCS_STATE_DIR}/<discocs_backend|discocs_bot|discocs_awg>/…
# (bind-mount, не docker volume) — контексты сервисов не перемешиваются на диске.

services:
  backend:
    image: ${REGISTRY:-192.168.1.41:5000}/${IMAGE_NS:-discocs}/backend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8711:7752"
    volumes:
      - ${DISCOCS_STATE_DIR}/discocs_backend/data:/app/data
      - ${DISCOCS_STATE_DIR}/discocs_backend/models:/app/models
      - type: bind
        source: ${DISCOCS_MUSIC_DIR:-/path/to/music}
        target: /music
        read_only: true
    environment:
      DISCOCS_DB_PATH: /app/data/app.db
      DISCOCS_DATA_DIR: /app/data
      DISCOCS_MODEL_DIR: /app/models
      DISCOCS_INDEX_DIR: /app/data
      # Access gate (Phase 1). Off by default; turn on only after the service
      # token is set on every internal caller (bot/worker/plugin). See docs/auth.md.
      DISCOCS_AUTH_ENABLED: ${DISCOCS_AUTH_ENABLED:-false}
      DISCOCS_SERVICE_TOKEN: ${DISCOCS_SERVICE_TOKEN:-}
      DISCOCS_SESSION_TTL_HOURS: ${DISCOCS_SESSION_TTL_HOURS:-720}
      DISCOCS_CORS_ORIGINS: ${DISCOCS_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7752/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: ${REGISTRY:-192.168.1.41:5000}/${IMAGE_NS:-discocs}/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DISCOCS_HTTP_PORT:-80}:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "7752"
    depends_on:
      backend:
        condition: service_healthy

  # Бот не имеет прямого доступа наружу (сеть площадки режет исходящий трафик до Telegram
  # API) — весь его сетевой стек проксируется через туннель awg (см. ниже).
  awg:
    image: wiktorbgu/amneziawg-mikrotik:latest
    restart: unless-stopped
    profiles: ["bot"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${DISCOCS_STATE_DIR}/discocs_awg/config:/etc/amnezia/amneziawg:ro
      - ${DISCOCS_STATE_DIR}/discocs_awg/start-awg.sh:/start-awg.sh:ro
    entrypoint: ["/bin/sh", "/start-awg.sh"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "ip", "link", "show", "awg0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    image: ${REGISTRY:-192.168.1.41:5000}/${IMAGE_NS:-discocs}/bot:${TAG:-latest}
    restart: unless-stopped
    profiles: ["bot"]
    # Сидит в сетевом неймспейсе awg — весь исходящий трафик (в т.ч. к Telegram API)
    # идёт через туннель. backend всё ещё резолвится по имени, т.к. awg на той же
    # compose-сети.
    network_mode: "service:awg"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS}
      NAVIDROME_BASE_URL: ${NAVIDROME_BASE_URL}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD}
      DISCOCS_BASE_URL: ${DISCOCS_BASE_URL:-http://backend:7752}
      # Same token as the backend — lets the bot pass the access gate when on.
      DISCOCS_SERVICE_TOKEN: ${DISCOCS_SERVICE_TOKEN:-}
      SQLITE_PATH: /data/bot.sqlite
      TEMP_DIR: /data/tmp
    volumes:
      - ${DISCOCS_STATE_DIR}/discocs_bot:/data
    depends_on:
      backend:
        condition: service_healthy
      awg:
        condition: service_healthy
