services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    restart: unless-stopped
    environment:
      DISCOCS_WORKER_SERVER: ${DISCOCS_WORKER_SERVER:-http://192.168.1.41:8711}
      # Machine token for the backend access gate — must match the backend's
      # DISCOCS_SERVICE_TOKEN when the gate is on (see docs/auth.md). Empty is
      # fine while the gate is off.
      DISCOCS_SERVICE_TOKEN: ${DISCOCS_SERVICE_TOKEN:-}
      DISCOCS_WORKER_ID: ${DISCOCS_WORKER_ID:-auto}
      DISCOCS_WORKER_EMBEDDING_MODELS: ${DISCOCS_WORKER_EMBEDDING_MODELS:-discogs_multi,discogs_track,discogs_release,discogs_label}
      DISCOCS_WORKER_AUDIO_FEATURE_MODEL: ${DISCOCS_WORKER_AUDIO_FEATURE_MODEL:-audio_features_v2}
      DISCOCS_WORKER_HEAD_MODEL: ${DISCOCS_WORKER_HEAD_MODEL:-discogs-effnet-heads}
      DISCOCS_WORKER_MUQ_MODEL: ${DISCOCS_WORKER_MUQ_MODEL:-muq_mulan}
      DISCOCS_WORKER_CLAIM_BATCH_SIZE: ${DISCOCS_WORKER_CLAIM_BATCH_SIZE:-2}
      DISCOCS_WORKER_MAX_INFLIGHT_TASKS: ${DISCOCS_WORKER_MAX_INFLIGHT_TASKS:-2}
      DISCOCS_WORKER_DOWNLOAD_CONCURRENCY: ${DISCOCS_WORKER_DOWNLOAD_CONCURRENCY:-1}
      DISCOCS_WORKER_SUBMIT_BATCH_SIZE: ${DISCOCS_WORKER_SUBMIT_BATCH_SIZE:-1}
      DISCOCS_WORKER_LEASE_SECONDS: ${DISCOCS_WORKER_LEASE_SECONDS:-900}
      DISCOCS_WORKER_POLL_SECONDS: ${DISCOCS_WORKER_POLL_SECONDS:-5}
      DISCOCS_WORKER_CPU_WORKERS: ${DISCOCS_WORKER_CPU_WORKERS:-0}
      DISCOCS_WORKER_GPU_BATCH_SIZE: ${DISCOCS_WORKER_GPU_BATCH_SIZE:-64}
      DISCOCS_WORKER_READY_BATCHES: ${DISCOCS_WORKER_READY_BATCHES:-1}
      DISCOCS_WORKER_MAX_TASKS_BEFORE_EXIT: ${DISCOCS_WORKER_MAX_TASKS_BEFORE_EXIT:-500}
      DISCOCS_WORKER_STARTUP_JITTER_SECONDS: ${DISCOCS_WORKER_STARTUP_JITTER_SECONDS:-60}
      DISCOCS_WORKER_EMBEDDING_BACKEND: ${DISCOCS_WORKER_EMBEDDING_BACKEND:-auto}
      DISCOCS_EFFNET_BACKEND: ${DISCOCS_EFFNET_BACKEND:-auto}
      DISCOCS_MODEL_DIR: /app/models
      DISCOCS_DATA_DIR: /worker-data
      DISCOCS_DB_PATH: /worker-data/worker-local.db
      DISCOCS_INDEX_DIR: /worker-data
      DISCOCS_AUDIO_LOADER: ffmpeg
      DISCOCS_FFMPEG_THREADS: ${DISCOCS_FFMPEG_THREADS:-1}
      DISCOCS_MUQ_MODEL_NAME: ${DISCOCS_MUQ_MODEL_NAME:-OpenMuQ/MuQ-MuLan-large}
      DISCOCS_MUQ_CACHE_DIR: ${DISCOCS_MUQ_CACHE_DIR:-/app/models/muq}
      DISCOCS_MUQ_DEVICE: ${DISCOCS_MUQ_DEVICE:-cuda}
      DISCOCS_MUQ_EMPTY_CACHE_EVERY: ${DISCOCS_MUQ_EMPTY_CACHE_EVERY:-25}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      TORCHDYNAMO_DISABLE: ${TORCHDYNAMO_DISABLE:-1}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:512}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HOME: ${HF_HOME:-/app/models/muq}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - type: bind
        source: "${DISCOCS_WORKER_MODEL_DIR:-/opt/discocs/models}"
        target: /app/models
        bind:
          create_host_path: false
      - discocs-worker-data:/worker-data
    entrypoint: ["python", "-m", "app.cli"]
    command:
      - worker
      - --server
      - ${DISCOCS_WORKER_SERVER:-http://192.168.1.41:8711}
      - --worker-id
      - ${DISCOCS_WORKER_ID:-auto}
      - --models
      - ${DISCOCS_WORKER_EMBEDDING_MODELS:-discogs_multi,discogs_track,discogs_release,discogs_label}
      - --models
      - ${DISCOCS_WORKER_AUDIO_FEATURE_MODEL:-audio_features_v2}
      - --models
      - ${DISCOCS_WORKER_HEAD_MODEL:-discogs-effnet-heads}
      - --models
      - ${DISCOCS_WORKER_MUQ_MODEL:-muq_mulan}
      - --claim-batch-size
      - ${DISCOCS_WORKER_CLAIM_BATCH_SIZE:-2}
      - --max-inflight-tasks
      - ${DISCOCS_WORKER_MAX_INFLIGHT_TASKS:-2}
      - --download-concurrency
      - ${DISCOCS_WORKER_DOWNLOAD_CONCURRENCY:-1}
      - --submit-batch-size
      - ${DISCOCS_WORKER_SUBMIT_BATCH_SIZE:-1}
      - --lease-seconds
      - ${DISCOCS_WORKER_LEASE_SECONDS:-900}
      - --poll-seconds
      - ${DISCOCS_WORKER_POLL_SECONDS:-5}
      - --cpu-workers
      - ${DISCOCS_WORKER_CPU_WORKERS:-0}
      - --gpu-batch-size
      - ${DISCOCS_WORKER_GPU_BATCH_SIZE:-64}
      - --ready-batches
      - ${DISCOCS_WORKER_READY_BATCHES:-1}
      - --max-tasks-before-exit
      - ${DISCOCS_WORKER_MAX_TASKS_BEFORE_EXIT:-500}
      - --startup-jitter-seconds
      - ${DISCOCS_WORKER_STARTUP_JITTER_SECONDS:-60}
      - --embedding-backend
      - ${DISCOCS_WORKER_EMBEDDING_BACKEND:-auto}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  discocs-worker-data:
