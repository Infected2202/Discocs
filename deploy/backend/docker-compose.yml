services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${DISCOCS_PORT:-7752}:7752"
    volumes:
      - discocs-data:/app/data
      - discocs-models:/app/models
      - type: bind
        source: ${DISCOCS_MUSIC_DIR:-/path/to/music}
        target: /music
        read_only: true
    environment:
      DISCOCS_DB_PATH: /app/data/app.db
      DISCOCS_DATA_DIR: /app/data
      DISCOCS_MODEL_DIR: /app/models
      DISCOCS_INDEX_DIR: /app/data
      # Implicit identity for private admin/CLI and auth-disabled compatibility;
      # not used by request-scoped multiuser API calls.
      DISCOCS_OWNER_USER: ${DISCOCS_OWNER_USER:-owner}

volumes:
  discocs-data:
  discocs-models:
